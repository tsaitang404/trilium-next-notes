name: Sync fork with upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Sync with upstream
        run: |
          git remote add upstream "https://github.com/TriliumNext/Notes.git"
          git fetch upstream develop
          git checkout develop
          git merge "upstream/develop" --ff-only
          # Keep only release workflows; remove upstream CI workflows
          # (codeql/dev/main-docker/nightly/playwright) so they don't
          # run on this fork. release.yml + release-winget.yml are kept.
          cd .github/workflows
          for f in codeql.yml dev.yml main-docker.yml nightly.yml playwright.yml; do
            if [ -f "$f" ]; then git rm --quiet "$f"; fi
          done
          cd ../..
          git commit -m "chore: prune upstream CI workflows (keep release only)" --allow-empty
          git push origin develop
