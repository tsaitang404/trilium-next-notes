name: Sync fork with upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Sync code with upstream
        run: |
          git config user.name "tsaitang404"
          git config user.email "tsaitang.agent@gmail.com"
          git remote add upstream "https://github.com/TriliumNext/Notes.git"
          git fetch upstream develop --tags
          git checkout develop
          # Reset to pure upstream (prune commits re-applied below)
          git reset --hard "upstream/develop"
          # Prune upstream workflows; keep only release.yml
          cd .github/workflows
          for f in codeql.yml dev.yml main-docker.yml nightly.yml playwright.yml release-winget.yml; do
            if [ -f "$f" ]; then git rm --quiet "$f"; fi
          done
          cd ../..
          git commit -m "chore: prune upstream workflows (keep release.yml only)" --allow-empty
          git push --force origin develop
          # Push version tags missing on fork (one ls-remote call, then push only absent ones)
          EXISTING=$(git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}')
          git tag | grep -E '^v[0-9]' | while read -r t; do
            echo "$EXISTING" | grep -qx "$t" && continue
            git push origin "refs/tags/$t:refs/tags/$t" 2>/dev/null || true
          done

      - name: Mirror upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # fetch mirror script from maintenance branch (develop is pure upstream, script lives in maintenance)
          git fetch origin maintenance
          git show FETCH_HEAD:scripts/mirror-releases.sh > /tmp/mirror-releases.sh
          chmod +x /tmp/mirror-releases.sh
          /tmp/mirror-releases.sh TriliumNext/Notes tsaitang404/trilium-next-notes 5
