name: Sync fork with upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Sync with upstream
        run: |
          git config user.name "tsaitang404"
          git config user.email "tsaitang.agent@gmail.com"
          git remote add upstream "https://github.com/TriliumNext/Notes.git"
          git fetch upstream develop
          git checkout develop
          # Reset to pure upstream (discard local prune commits; they are re-applied below)
          git reset --hard "upstream/develop"
          # Prune upstream workflows; keep only release.yml (tag release builds)
          # Remove: CI checks (codeql/dev/main-docker/nightly/playwright)
          #         + winget publish (no WINGET_PAT on this fork)
          cd .github/workflows
          for f in codeql.yml dev.yml main-docker.yml nightly.yml playwright.yml release-winget.yml; do
            if [ -f "$f" ]; then git rm --quiet "$f"; fi
          done
          cd ../..
          git commit -m "chore: prune upstream workflows (keep release.yml only)" --allow-empty
          git push --force origin develop
